server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-origin: proxy API calls to the api service. The trailing slash on
  # proxy_pass strips the /api prefix, so the api sees /auth, /projects, etc.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — client-side routing. Security headers live here (on the HTML
  # document) since the API sets its own via helmet. CSP is locked to same-origin;
  # 'unsafe-inline' is allowed only for styles (the design system + Vite-injected
  # CSS), never for scripts. connect-src 'self' because the API is same-origin /api.
  location / {
    try_files $uri $uri/ /index.html;
    # Same-origin CSP — fonts are self-hosted (bundled via @fontsource); no CDN.
    # `data:` is allowed for fonts (Vite inlines small font subsets as data URIs) and
    # images (the inline SVG favicon) — neither can execute code. script-src stays 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # Static asset caching (hashed filenames from Vite).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # PWA control files must NOT be cached, or a deploy can't update the service worker /
  # manifest (clients would keep an old SW that serves a stale shell). index.html is the
  # SPA entry and is revalidated for the same reason.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
}
